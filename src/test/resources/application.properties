spring.application.name=account-service-test
#Database H2 in memoria per i test
spring.datasource.url=jdbc:h2:mem:account_service_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.jwt.issuer=contocorrente

clients.user.base-url=http://user.test
clients.transaction.base-url=http://transaction.test