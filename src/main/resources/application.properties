spring.application.name=account-service
server.port=8082
spring.main.web-application-type=servlet
#Connessione ad DB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#Verifica lo schema del database all'avvio
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Rifiuta proprietà JSON non previste dai DTO
spring.jackson.deserialization.fail-on-unknown-properties=true
# Documentazione Swagger/OpenAPI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
security.jwt.secret=${CC_JWT_SECRET}
security.jwt.issuer=contocorrente
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=3s
spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
app.kafka.transaction-topic=transaction-created
